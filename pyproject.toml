[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevnav"
version = "1.0.0"
description = "JevNavAgent: Budget-Decoupled Single-Forward Visual Navigation and Counterfactual Trajectory Alignment for Gigapixel Whole-Slide Pathology"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "openslide-python>=1.3.1",
    "pyarrow>=14.0",
    "huggingface-hub>=0.23.0",
    "shapely>=2.0",
    "torch>=2.2",
    "transformers>=4.49",
    "peft>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jevnav-download = "jevnav.data.download:main"
jevnav-eval = "jevnav.eval.runner:main"
jevnav-score = "jevnav.eval.metrics:main"
jevnav-train-sft = "jevnav.train.sft:main"

[tool.setuptools.packages.find]
include = ["jevnav*"]
